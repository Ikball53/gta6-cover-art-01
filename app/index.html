<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="brand-mark" aria-hidden="true"></span>
  <div class="brand-text">
    <h1 class="brand-title">Vice Cover Maker</h1>
    <p class="brand-tag">Turn a photo into bold poster cover art.</p>
  </div>
</header>
<main class="layout">
  <section class="stage-col" aria-label="Cover preview">
    <div class="stage-frame">
      <canvas id="coverCanvas" width="1920" height="1080"></canvas>
    </div>
    <p class="drop-hint">Drop a photo anywhere to use it</p>
  </section>
  <aside class="panel" aria-label="Cover controls">
    <div class="ctrl-block">
      <label class="ctrl-label" for="sizePick">Export size</label>
      <select id="sizePick" class="field">
        <option value="landscape" selected>Landscape 1920 x 1080</option>
        <option value="portrait">Portrait 1080 x 1350</option>
        <option value="square">Square 1080 x 1080</option>
      </select>
    </div>
    <div class="ctrl-block">
      <span class="ctrl-label" id="sceneLabel">Background scene</span>
      <div class="seg-control" role="group" aria-labelledby="sceneLabel">
        <button type="button" class="seg-btn is-active" data-plate="sunset" aria-pressed="true">Sunset Beach</button>
        <button type="button" class="seg-btn" data-plate="neon" aria-pressed="false">Neon Street</button>
      </div>
    </div>
    <div class="ctrl-block">
      <span class="ctrl-label" id="photoLabel">Photo</span>
      <div class="btn-row" role="group" aria-labelledby="photoLabel">
        <button type="button" id="choosePhotoBtn" class="file-btn">Choose a photo</button>
        <input type="file" id="photoInput" accept="image/*" hidden>
      </div>
      <div class="btn-row">
        <button type="button" id="sampleBoulevard" class="ghost-btn">Sample: Boulevard</button>
        <button type="button" id="samplePier" class="ghost-btn">Sample: Pier</button>
      </div>
      <p class="mini-hint">You can also drag and drop an image file onto the page.</p>
    </div>
    <div class="ctrl-block">
      <label class="ctrl-label" for="photoScale">Photo size</label>
      <input type="range" id="photoScale" class="slider" min="30" max="80" value="52" step="1">
    </div>
    <div class="ctrl-block">
      <label class="ctrl-label" for="photoLift">Photo position</label>
      <input type="range" id="photoLift" class="slider" min="0" max="100" value="42" step="1">
    </div>
    <div class="ctrl-block">
      <label class="ctrl-label" for="titleField">Title</label>
      <input type="text" id="titleField" class="field" value="GRAND THEFT AUTO VI" maxlength="60" autocomplete="off">
    </div>
    <div class="ctrl-block">
      <label class="ctrl-label" for="captionField">Caption</label>
      <input type="text" id="captionField" class="field" maxlength="48" placeholder="Your caption" autocomplete="off">
    </div>
    <div class="ctrl-block">
      <label class="ctrl-label" for="gradePick">Colour grade</label>
      <select id="gradePick" class="field">
        <option value="sunset" selected>Sunset</option>
        <option value="neon">Neon</option>
        <option value="none">None</option>
      </select>
    </div>
    <button type="button" id="exportBtn" class="export-btn">Export PNG</button>
    <p id="statusLine" class="status-line" role="status" aria-live="polite">Loading…</p>
  </aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>

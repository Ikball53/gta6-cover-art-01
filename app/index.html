<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1 class="brand">Vice Cover Maker</h1>
  <p class="tagline">Your photos. Your caption. Poster-grade cover art.</p>
</header>
<main class="layout">
  <section class="controls" aria-label="Editor controls">
    <div class="control-group">
      <label for="photoInput">Photos</label>
      <input id="photoInput" type="file" accept="image/*" multiple>
      <p class="hint">Pick one photo to fill every panel, or several for a collage. Photos never leave your machine.</p>
    </div>
    <div class="control-group">
      <label for="sizeSelect">Export size</label>
      <select id="sizeSelect">
        <option value="1080x1080" selected>1080 x 1080 (square)</option>
        <option value="1080x1350">1080 x 1350 (portrait)</option>
        <option value="1920x1080">1920 x 1080 (landscape)</option>
      </select>
    </div>
    <div class="control-group">
      <label for="gradeSelect">Colour grade</label>
      <select id="gradeSelect">
        <option value="sunset" selected>Sunset</option>
        <option value="neon">Neon</option>
      </select>
    </div>
    <div class="control-group">
      <label for="captionInput">Caption</label>
      <input id="captionInput" type="text" value="VICE CITY" maxlength="28" autocomplete="off">
      <label for="subtitleInput">Subtitle</label>
      <input id="subtitleInput" type="text" value="A POSTER STORY" maxlength="40" autocomplete="off">
    </div>
    <div class="control-group">
      <label for="panelSelect">Panel to adjust</label>
      <select id="panelSelect">
        <option value="0" selected>Main panel</option>
        <option value="1">Panel 2</option>
        <option value="2">Panel 3</option>
      </select>
      <label for="zoomRange">Photo zoom</label>
      <input id="zoomRange" type="range" min="1" max="2.5" step="0.01" value="1">
      <p class="hint">Drag a photo on the preview to reposition it. Use the slider to zoom the selected panel.</p>
    </div>
    <button id="exportButton" type="button">Export PNG</button>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="coverCanvas" width="1080" height="1080"></canvas>
    <p class="preview-note">Live preview. Export renders at full size.</p>
  </section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
